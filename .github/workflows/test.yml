name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Store, notifications, cache and IPC tests
        run: node --test
      - name: Synthetic builder tests
        run: |
          python -m pip install psutil==7.2.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
      - name: Extension syntax
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem extension -File) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Windows PowerShell launcher syntax
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'launch.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }
      - name: Package Windows helper without Codex binaries
        run: |
          python -m pip install -r packaging/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python package_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the frozen distribution in a Korean path
        shell: pwsh
        run: |
          $env:CODEX_LABELS_PACKAGE_ZIP = (Get-ChildItem dist/Codex-Labels-*-windows-x64.zip).FullName
          python -m unittest discover -s tests -p test_windows_package.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: codex-labels-windows-x64
          path: |
            dist/Codex-Labels-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Synthetic sidebar in real Chromium
        env:
          CODEX_LABELS_BROWSER_TESTS: '1'
        run: python -m unittest discover -s tests -p 'test_*renderer.py' -v
