name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Store tests
        run: node --test extension/store.test.cjs
      - name: Builder tests
        run: python -m unittest discover -s tests -v
      - name: Extension syntax
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem extension -File) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Launcher syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'launch.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Write-Error; exit 1 }
