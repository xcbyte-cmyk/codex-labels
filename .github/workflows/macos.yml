name: macOS preview checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test extension/*.test.cjs
      - run: python3 -m unittest discover -s tests -p test_prepare_runtime.py
      - run: python3 -m unittest discover -s tests -p test_macos_build.py
      - run: zsh -n install-macos.command launch-macos.command
